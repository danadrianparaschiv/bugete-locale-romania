[project]
name = "bgconvertor"
version = "0.1.0"
description = "Convert Romanian local administration budget PDFs to validated Excel (Ordinul 1954/2005 nomenclator)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "httpx>=0.27",
    "pillow>=12.3.0",
    "pdfplumber>=0.11.10",
    "rapidfuzz>=3.14.5",
    "docling>=2.121.0",
    "onnxruntime>=1.29.0",
    "anthropic>=1.0.0",
]

[project.scripts]
bgconvertor = "bgconvertor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgconvertor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
