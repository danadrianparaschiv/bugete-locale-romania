<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bugete locale{% endblock %}</title>
<style>
  :root { --ink:#1a1d21; --dim:#6a7178; --line:#e3e6e9; --ok:#1a7f37; --warn:#b8860b; --bad:#b02a37; --bg:#ffffff; --card:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 62rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  .sub { color: var(--dim); margin-bottom: 1.5rem; }
  .years { margin: -.75rem 0 1.25rem; }
  .about { background: var(--card); border-radius: .6rem; padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-size: .95rem; }
  .about p { margin: .5rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge { display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.8rem; }
  .b-ok { background:#e6f4ea; color:var(--ok); }
  .b-mid { background:#fcf3d7; color:var(--warn); }
  .b-low { background:#fbe9eb; color:var(--bad); }
  .b-pending { background:var(--card); color:var(--dim); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(14rem,1fr)); gap:1rem; margin:1.25rem 0; }
  .card { background:var(--card); border-radius:.6rem; padding:1rem; }
  .card .k { color:var(--dim); font-size:.85rem; }
  .card .v { font-size:1.5rem; font-weight:650; font-variant-numeric: tabular-nums; }
  a { color:#0b57d0; text-decoration:none; } a:hover { text-decoration:underline; }
  .note { color:var(--dim); font-size:.85rem; margin-top:2rem; border-top:1px solid var(--line); padding-top:1rem; }
  /* infografic */
  .ig-h { font-size:1.05rem; margin:1.6rem 0 .6rem; }
  .ig-card { background:var(--card); border:1px solid var(--line); border-radius:.6rem; padding:1rem 1.1rem; }
  svg { display:block; width:100%; height:auto; }
  .tag { font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; padding:.05rem .4rem;
         border:1px solid currentColor; border-radius:4px; white-space:nowrap; }
  .tabs { display:flex; gap:.25rem; flex-wrap:wrap; margin:.6rem 0 1.1rem;
          border-bottom:1px solid var(--line); }
  .tabs button { font-size:.92rem; background:none; border:0; border-bottom:2px solid transparent;
    color:var(--dim); padding:.5rem .85rem; cursor:pointer; margin-bottom:-1px; }
  .tabs button:hover { color:var(--ink); }
  .tabs button.on { color:var(--ink); font-weight:650; border-bottom-color:var(--ink); }
  .tabs button[data-empty] { opacity:.45; }
  .toolbar { display:flex; gap:.4rem; flex-wrap:wrap; margin:.6rem 0 .8rem; }
  .toolbar button { font-size:.78rem; letter-spacing:.04em; background:#fff; color:var(--dim);
    border:1px solid var(--line); padding:.35rem .8rem; border-radius:999px; cursor:pointer; }
  .toolbar button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .bars { display:flex; flex-direction:column; gap:.45rem; }
  .brow { display:grid; grid-template-columns:minmax(120px,220px) 1fr auto; gap:.8rem; align-items:center;
          cursor:pointer; border-radius:4px; }
  .brow.sel .bt { font-weight:650; }
  .brow:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .bt { font-size:.88rem; line-height:1.25; }
  .bg2 { background:#e8ebee; border-radius:4px; height:16px; overflow:hidden; display:flex; }
  .bg2 i { display:block; height:100%; }
  .bv { font-variant-numeric:tabular-nums; font-size:.8rem; color:var(--dim); white-space:nowrap; }
  .detail { margin-top:1rem; border-top:1px solid var(--line); padding-top:.8rem; }
  .detail .ttl { display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap; margin-bottom:.3rem; }
  .detail .ttl h3 { font-size:1rem; margin:0; }
  .detail .ttl .amt { color:var(--dim); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .hint { font-size:.85rem; color:var(--dim); margin:.2rem 0 .6rem; }
  .hundred { display:flex; flex-wrap:wrap; gap:4px; max-width:520px; margin-top:.4rem; }
  .coin { width:13px; height:13px; border-radius:3px; }
  .hlegend { display:flex; flex-wrap:wrap; gap:.9rem; margin-top:.8rem; font-size:.85rem; color:var(--dim); }
  .hlegend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
  .hlegend b { color:var(--ink); }
  @media (max-width:560px){ .brow { grid-template-columns:1fr auto; gap:.3rem; } .bg2 { grid-column:1/-1; } }
</style>
</head>
<body><main>
{% block content %}{% endblock %}
<p class="note">Date extrase automat din documentele PDF oficiale; cifrele provin exclusiv din
liniile extrase fără probleme de validare. Procentul nu măsoară rândurile lipsă.
Nu sunt cifre oficiale — vezi <a href="{{ base }}/DISCLAIMER.md">DISCLAIMER</a>.
Generat de <a href="https://github.com/danadrianparaschiv/bugete-locale-romania">bugete-locale-romania</a> (bgconvertor).</p>
</main></body></html>
