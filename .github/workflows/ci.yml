name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run ruff check src tests scripts
      - name: materialize digital reference extraction (Alba Iulia)
        # ~25s, fully offline (digital PDF, no OCR, no LLM). Populates runs/
        # so the anchor test (test_ab_stays_fully_clean) and the digital
        # golden fixtures actually run instead of skipping.
        run: uv run bgconvertor convert data/2026/01-alba/1017-alba-iulia/budget_file.pdf
      - name: offline test suite
        # LLM tests use fake clients/local cache — nothing here touches the
        # network or an API key; tests for PDFs not extracted above still skip
        run: uv run pytest -q
      - name: golden-fixture eval — digital + exhaustive scanned-layout gates
        # Alba Iulia is extracted from its PDF. Committed Arad/Pitesti OCR
        # grids exhaustively gate 232 general-matrix cells, 216 transposed
        # cells, 51 institution
        # cells, all 216 cells in a stamp-collapsed annual table, and all 245
        # cells in a collapsed economic-detail table, plus all 80 cells in a
        # stamp-damaged expense chapter, 62 investment-financing cells, and 73
        # numeric cells in the numbered Arad revenue page (with all 15 X
        # markers anchored), offline. Alba's digital page adds 180 cells.
        run: >-
          uv run bgconvertor eval
          --min-anchors 126
          --min-text-assertions 16
          --require-cell-ground-truth 9
          --min-layout-cell-recall 90
          --min-layout-cell-precision 99.5
          --json-out eval-report.json
      - name: audit public artifact consistency
        # Every converted entry must remain a modern, hashed, internally
        # consistent bundle. Entries not yet converted remain out of scope.
        run: uv run bgconvertor corpus audit data --strict --require-modern --json-out artifact-audit.json
      - name: publish machine-readable quality reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-py${{ matrix.python-version }}
          path: |
            eval-report.json
            artifact-audit.json
